<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library ML</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg:        #f5f6fa;
            --surface:   #ffffff;
            --ink:       #0f172a;
            --muted:     #64748b;
            --line:      #e7e9f0;
            --accent:    #4f46e5;
            --accent-2:  #7c3aed;
            --accent-soft: #eef2ff;
            --sidebar:   #0b0d17;
            --radius:    16px;
            --shadow:    0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.04);
            --shadow-lg: 0 12px 32px rgba(15,23,42,.10);
        }

        html { -webkit-font-smoothing: antialiased; }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background:
                radial-gradient(1200px 500px at 100% -10%, rgba(124,58,237,.06), transparent 60%),
                radial-gradient(900px 400px at 20% -10%, rgba(79,70,229,.06), transparent 60%),
                var(--bg);
            background-attachment: fixed;
            color: var(--ink);
        }

        input, select, textarea, button { font-family: inherit; }
        ::selection { background: rgba(79,70,229,.18); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 248px;
            height: 100vh;
            background: linear-gradient(180deg, #11142a 0%, var(--sidebar) 100%);
            color: #e2e8f0;
            padding: 24px 16px;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 100;
            border-right: 1px solid rgba(255,255,255,.04);
        }

        .sidebar-logo {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 28px;
            padding: 0 8px;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-mark {
            width: 34px; height: 34px;
            border-radius: 10px;
            display: grid; place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 6px 18px rgba(79,70,229,.45);
        }

        .sidebar-logo span {
            background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-section {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #4b5378;
            padding: 8px 12px;
        }

        .sidebar a {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #8b93b8;
            padding: 10px 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color .15s ease, background .15s ease;
        }

        .sidebar a:hover { color: #fff; background: rgba(255,255,255,.05); }
        .sidebar a:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 2px; }

        .sidebar a.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(99,102,241,.28), rgba(124,58,237,.12));
            box-shadow: inset 0 0 0 1px rgba(165,180,252,.15);
        }

        .sidebar a.active::before {
            content: '';
            position: absolute;
            left: -16px; top: 9px; bottom: 9px;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(180deg, #818cf8, #a78bfa);
        }

        .sidebar a svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 14px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.05);
            font-size: 11px;
            color: #6b7399;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,.18);
        }

        /* ===== MAIN ===== */
        .main {
            margin-left: 248px;
            padding: 36px 40px 64px;
            min-height: 100vh;
        }

        /* ===== SHARED CARD ===== */
        .card {
            background: var(--surface);
            padding: 22px 24px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
        }

        /* ===== SHARED PAGE HEADER ===== */
        .page-head { margin-bottom: 28px; }
        .page-head h1 {
            font-size: 26px; font-weight: 800; letter-spacing: -0.025em;
            margin: 0 0 4px; color: var(--ink);
        }
        .page-head p { font-size: 14px; color: var(--muted); margin: 0; }

        /* Tablet & ponsel: sidebar jadi bar navigasi di atas, tetap bisa dipakai */
        @media (max-width: 900px) {
            .sidebar {
                position: sticky;
                width: 100%;
                height: auto;
                flex-direction: row;
                align-items: center;
                padding: 10px 16px;
                gap: 4px;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .sidebar-logo { margin: 0 8px 0 0; font-size: 0; gap: 0; }
            .sidebar-section, .sidebar-footer { display: none; }
            .sidebar a { white-space: nowrap; padding: 8px 12px; font-size: 13px; }
            .sidebar a.active::before { display: none; }
            .main { margin-left: 0; padding: 20px 16px 48px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

<body>

<nav class="sidebar" aria-label="Navigasi utama">
    <div class="sidebar-logo">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
        </div>
        Library <span>ML</span>
    </div>

    <div class="sidebar-section">Menu</div>

    <a href="/" id="nav-home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
    </a>
    <a href="/input" id="nav-input">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Input Data
    </a>
    <a href="/dashboard" id="nav-dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
    </a>
    <a href="/batch" id="nav-batch">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Batch Predict
    </a>
    <a href="/history-page" id="nav-history">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        Riwayat
    </a>

    <div class="sidebar-footer">
        <span class="status-dot"></span> Model aktif · v1.0
    </div>
</nav>

<script>
if (window.Chart) {
    Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = '#eef0f5';
    Chart.defaults.plugins.tooltip.backgroundColor = '#0f172a';
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.cornerRadius = 10;
    Chart.defaults.plugins.tooltip.titleFont = { weight: '600' };
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.elements.bar.borderRadius = 8;
    Chart.defaults.elements.line.borderWidth = 2.5;
    Chart.defaults.animation.duration = 700;
}
</script>

<main class="main">
    {% block content %}{% endblock %}
</main>

<script>
(function() {
    var path = window.location.pathname;
    var map = {
        '/': 'nav-home',
        '/input': 'nav-input',
        '/dashboard': 'nav-dashboard',
        '/batch': 'nav-batch',
        '/history-page': 'nav-history'
    };
    var id = map[path];
    if (id) {
        var el = document.getElementById(id);
        if (el) { el.classList.add('active'); el.setAttribute('aria-current', 'page'); }
    }
})();
</script>

</body>
</html>
